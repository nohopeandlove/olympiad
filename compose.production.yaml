# App VPS only. Requires Docker Compose >= 2.24.4 (!override / !reset).
# docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up --build -d
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set production database password}
  redis:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS site origin}
      DATABASE_URL: postgresql+psycopg://olympiad:${POSTGRES_PASSWORD:?Set production database password}@postgres/olympiad
      JUDGE_URL: ${JUDGE_URL:?Set HTTPS address of remote judge}
      SMTP_HOST: ${SMTP_HOST:?Set real SMTP host}
      SMTP_FROM: ${SMTP_FROM:?Set real sender address}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  worker:
    restart: unless-stopped
    depends_on: !override
      backend: {condition: service_healthy}
    networks: !override [data, web]
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS site origin}
      DATABASE_URL: postgresql+psycopg://olympiad:${POSTGRES_PASSWORD:?Set production database password}@postgres/olympiad
      JUDGE_URL: ${JUDGE_URL:?Set HTTPS address of remote judge}
      SMTP_HOST: ${SMTP_HOST:?Set real SMTP host}
      SMTP_FROM: ${SMTP_FROM:?Set real sender address}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  frontend:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
    ports: !reset []
    volumes: !override
      - ./infra/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
  mailpit:
    profiles: [development-mail]
  judge:
    profiles: [local-judge]
  sandbox-image:
    profiles: [local-judge]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      NO_PROXY: nginx,localhost,127.0.0.1
      SITE_DOMAIN: ${SITE_DOMAIN:?Set registered site domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    volumes:
      - ./infra/Caddyfile.app:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on:
      nginx: {condition: service_started}
volumes:
  caddy_data:
  caddy_config:
